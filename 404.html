.ctas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
a.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 22px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .15s,background-color .15s;touch-action:manipulation;}
a.primary{background:#F2B640;color:#111C33;} a.primary:hover{background:#FFC857;}
a.ghost{color:#fff;border:1px solid rgba(255,255,255,.25);} a.ghost:hover{background:rgba(255,255,255,.08);}
