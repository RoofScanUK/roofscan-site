<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>RoofScan UK — Owner</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--n:#1C2B4A;--g:#C9A84C;--bg:#F8F6F0;--br:#E8E4D8;--mu:#6B7A8D;--rd:#B3261E;--gr:#1E8E4E;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;background:var(--bg);color:var(--n);max-width:760px;margin:0 auto;padding:0 14px 60px;}
h1{font-size:20px;font-weight:800;padding:16px 0 4px;}
.sl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mu);margin:20px 0 8px;}
.card{background:#fff;border:1px solid var(--br);border-radius:12px;padding:14px;margin-bottom:10px;}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap;}
.sub{font-size:12px;color:var(--mu);}
.btn{border:none;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;background:var(--n);color:var(--g);}
.btn.ghost{background:none;color:var(--n);border:1px solid var(--br);}
.btn.red{background:var(--rd);color:#fff;}
.inp{width:100%;border:1px solid var(--br);border-radius:9px;padding:12px;font-size:16px;font-family:inherit;margin-bottom:10px;}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:2px 9px;margin:2px 4px 0 0;}
.t-red{background:#FDECEA;color:#8A1C14;}.t-grn{background:#E8F8EF;color:#14663A;}.t-amb{background:#FEF3E2;color:#7A4A07;}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.stat{background:#fff;border:1px solid var(--br);border-radius:10px;padding:10px;text-align:center;}
.stat b{font-size:20px;display:block;}
#err{display:none;background:#FDECEA;color:#8A1C14;border-radius:10px;padding:10px;font-size:13px;margin-top:10px;}
</style>
</head>
<body>
<div id="login" style="display:none;padding-top:60px;">
  <h1>RoofScan owner</h1>
  <div id="s1"><p class="sub" style="margin:6px 0 16px;">Owner email address. We'll send a 6-digit code.</p>
    <input class="inp" id="email" type="email" placeholder="owner email"><button class="btn" style="width:100%;padding:13px;" onclick="sendCode()">Email me a code</button></div>
  <div id="s2" style="display:none;"><p class="sub" style="margin:6px 0 16px;">Enter the code we just emailed you.</p>
    <input class="inp" id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit code"><button class="btn" style="width:100%;padding:13px;" onclick="verifyCode()">Log in</button></div>
  <div id="err"></div>
</div>
<div id="app" style="display:none;">
  <div class="row"><h1>RoofScan owner</h1><div style="padding-top:14px;"><button class="btn ghost" onclick="load()">Refresh</button> <button class="btn ghost" onclick="logout()">Log out</button></div></div>
  <div class="stats" id="stats"></div>
  <div class="sl">Needs you</div><div id="needs"></div>
  <div class="sl">Contractors</div><div id="ctrs"></div>
  <div class="sl">Claimed right now</div><div id="claimed"></div>
  <div class="sl">Stand-downs (unsafe to fly, no penalty)</div><div id="stood"></div>
  <div class="sl">Missed jobs</div><div id="missed"></div>
</div>
<script>
const API='https://roofscan-api.tiny-voice-ac40.workers.dev', TK='rs_owner_token';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let email='', data=null;
async function api(p,m,b){const t=localStorage.getItem(TK);const r=await fetch(API+p,{method:m||'GET',headers:Object.assign({'Content-Type':'application/json'},t?{Authorization:'Bearer '+t}:{}),body:b?JSON.stringify(b):undefined});let d={};try{d=await r.json();}catch(e){}if(r.status===401&&p.indexOf('/owner/verify')<0&&p.indexOf('request-code')<0){localStorage.removeItem(TK);showLogin();}return{ok:r.ok,status:r.status,data:d};}
function showLogin(msg){$('app').style.display='none';$('login').style.display='block';const e=$('err');if(msg){e.textContent=msg;e.style.display='block';}else e.style.display='none';}
async function sendCode(){email=$('email').value.trim().toLowerCase();await api('/owner/request-code','POST',{email});$('s1').style.display='none';$('s2').style.display='block';$('err').style.display='none';}
async function verifyCode(){const r=await api('/owner/verify','POST',{email,code:$('otp').value.trim()});if(!r.ok){showLogin(r.data.error||'That code is not right.');return;}localStorage.setItem(TK,r.data.token);load();}
function logout(){localStorage.removeItem(TK);showLogin();}
function tag(t,c){return `<span class="tag t-${c}">${esc(t)}</span>`;}
async function load(){
  if(!localStorage.getItem(TK)){showLogin();return;}
  const r=await api('/owner/overview');if(!r.ok){if(r.status!==401)showLogin('Could not load. Try again.');return;}
  data=r.data;$('login').style.display='none';$('app').style.display='block';
  const c=data.counts;
  $('stats').innerHTML=[['Scans open',c.scansOpen],['Reports open',c.reportsOpen],['Scans claimed',c.scansClaimed],['Reports claimed',c.reportsClaimed]].map(x=>`<div class="stat"><b>${x[1]}</b><span class="sub">${x[0]}</span></div>`).join('');
  $('needs').innerHTML=data.needsYou.length?data.needsYou.map(n=>`<div class="card"><b>${esc(n.name)}</b><div>${n.needs.map(x=>tag(x,'amb')).join('')}</div></div>`).join(''):'<div class="card sub">Nothing needs you right now.</div>';
  $('ctrs').innerHTML=data.contractors.map(ct=>`<div class="card"><div class="row"><div><b>${esc(ct.name)}</b> <span class="sub">${esc(ct.role)}</span>
    <div>${ct.active?tag('Active','grn'):tag('Switched off','red')}${ct.role!=='Report Writer'?(ct.approved?tag('Drone approved','grn'):tag('Drone not approved','amb')):''}</div>
    ${ct.role!=='Report Writer'?`<div class="sub">${esc(ct.droneModel)||'No drone'} · rated ${ct.ratedWind||'?'} m/s · insurance ${esc(ct.insuranceExpiry)||'?'} · Operator ID ${esc(ct.operatorIdExpiry)||'?'}</div>`:''}</div>
    <div>${ct.role!=='Report Writer'?`<button class="btn" onclick="upd('${ct.id}',{approved:${!ct.approved}})">${ct.approved?'Revoke drone approval':'Approve drone'}</button> `:''}<button class="btn ${ct.active?'red':''}" onclick="upd('${ct.id}',{active:${!ct.active}})">${ct.active?'Switch off':'Switch on'}</button></div></div>
    ${ct.role!=='Report Writer'?`<div class="sub" style="margin-top:8px;">Insurance expiry <input type="date" value="${esc(ct.insuranceExpiry)}" onchange="upd('${ct.id}',{insuranceExpiry:this.value})"> Operator ID expiry <input type="date" value="${esc(ct.operatorIdExpiry)}" onchange="upd('${ct.id}',{operatorIdExpiry:this.value})"></div>`:''}</div>`).join('')||'<div class="card sub">No contractors yet.</div>';
  const jl=(arr,f)=>arr.length?arr.map(f).join(''):'<div class="card sub">None.</div>';
  $('claimed').innerHTML=jl(data.claimed,j=>`<div class="card"><b>${esc(j.client)}</b> <span class="sub">${esc(j.kind)} · ${esc(j.by)} · ${esc(j.date)}</span><div class="sub">${esc(j.address)}</div></div>`);
  $('stood').innerHTML=jl(data.standDowns,j=>`<div class="card"><b>${esc(j.client)}</b> <span class="sub">${esc(j.date)}</span><div class="sub" style="white-space:pre-line;">${esc(j.reason)}</div></div>`);
  $('missed').innerHTML=jl(data.misses,j=>`<div class="card"><b>${esc(j.client)}</b> <span class="sub">${esc(j.date)}</span><div class="sub">${j.scanBy?'Scan missed by '+esc(j.scanBy)+' ':''}${j.reportBy?'Report missed by '+esc(j.reportBy):''}</div></div>`);
}
async function upd(id,change){const r=await api('/owner/contractor','POST',Object.assign({id},change));if(!r.ok){alert(r.data.error||'Could not save.');return;}load();}
$('email').addEventListener('keydown',e=>{if(e.key==='Enter')sendCode();});
$('otp').addEventListener('keydown',e=>{if(e.key==='Enter')verifyCode();});
load();
</script>
</body>
</html>
